    <!-- K upper diagonal -->
    <line x1="400" y1="300" x2="580" y2="55" stroke-width="72"/>
    <!-- K lower diagonal -->
    <line x1="400" y1="300" x2="580" y2="545" stroke-width="72"/>
  </g>
