<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A810"/>
      <stop offset="100%" stop-color="#F5C518"/>
    </linearGradient>
  </defs>
  <g stroke="url(#g)" fill="none" stroke-linecap="butt" stroke-width="72">
    <!-- M: two vertical legs -->
    <line x1="85" y1="35" x2="85" y2="545"/>
    <line x1="310" y1="35" x2="310" y2="545"/>
    <!-- M: V-shape connecting tops of legs down to valley -->
    <line x1="85" y1="55" x2="197" y2="330"/>
    <line x1="197" y1="330" x2="310" y2="55"/>
    <!-- K: upper arm from mid-right-leg to upper right -->
    <line x1="310" y1="280" x2="545" y2="50"/>
    <!-- K: lower arm from mid-right-leg to lower right -->
    <line x1="310" y1="280" x2="545" y2="545"/>
  </g>
</svg>
