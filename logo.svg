<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 580" width="640" height="580">
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4A810"/>
      <stop offset="100%" stop-color="#F5C518"/>
    </linearGradient>
  </defs>
  <g stroke="url(#g)" fill="none" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10">
    <!-- M shape: left-bottom → peak → valley → peak → right-bottom -->
